<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="wl.title">Potensi, realisasi, dan proyek per provinsi | Direktori METI</title>
<meta name="description" content="Peta 38 provinsi: kapasitas EBT terpasang, rasio elektrifikasi, potensi panas bumi, dan proyek terlacak, dengan sumber dan tanggal di setiap angka." data-i18n-attr="content:wl.deskripsi">
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/analisis.css">
<link rel="stylesheet" href="/grafik.css">
<script src="/tema.js"></script>
</head>
<body>
<header class="top" id="kepala"></header>
<main class="jm-halaman jm-wadah jm-an">
<div id="daftar">
<section class="jm-kh" aria-labelledby="judul">
  <div class="jm-kh-teks">
    <h1 id="judul" data-i18n="wl.judul">Realisasi per provinsi</h1>
    <p id="jawab" class="jm-kh-lead"></p>
  </div>
  <div class="jm-kh-ubin" id="ubin" aria-live="polite"></div>
</section>
<section id="kartu" class="jm-an-kartu-baris" aria-label="Ringkasan" data-i18n-attr="aria-label:an.ringkasan"></section>
<section class="jm-ex" aria-labelledby="j-peta">
  <header class="jm-ex-hd">
    <div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-peta"/></svg><span data-i18n="wl.ey.peta">Peta provinsi</span></span>
      <h2 class="jm-ex-j" id="j-peta"></h2><p class="jm-ex-sub" id="sub-peta"></p></div>
    <div class="jm-ex-aksi" id="aksi-peta"><!-- aksi unduh/bagikan: aksiHtml() dari /inti/aksi_ex.js dipasang orkestrator --></div>
  </header>
  <div class="jm-ex-bd jm-wl-bd">
    <div class="jm-tab jm-wl-seg" role="tablist" aria-label="Metrik" data-i18n-attr="aria-label:wl.metrik">
      <button type="button" role="tab" data-m="terpasang" aria-selected="true"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-tek-listrik"/></svg><span data-i18n="wl.m.terpasang">Kapasitas terpasang (MW)</span></button>
      <button type="button" role="tab" data-m="panasbumi" aria-selected="false"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-tek-panas"/></svg><span data-i18n="wl.m.panasbumi">Potensi panas bumi (MW)</span></button>
      <button type="button" role="tab" data-m="proyek" aria-selected="false"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-proyek"/></svg><span data-i18n="wl.m.proyek">Jumlah proyek</span></button>
      <button type="button" role="tab" data-m="rued" aria-selected="false"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-regulasi"/></svg><span data-i18n="wl.m.rued">Perda RUED</span></button>
    </div>
    <div class="jm-wl-bingkai">
      <div id="peta" class="jm-wl-peta" role="region" aria-label="Peta" data-i18n-attr="aria-label:wl.peta_label"></div>
      <div id="legenda" class="jm-wl-legenda"><p class="jm-wl-lg-j" id="lg-j"></p><div id="lg-isi"></div></div>
      <aside id="peringkat" class="jm-wl-pr" aria-label="Peringkat" data-i18n-attr="aria-label:wl.ey.urut"><h3 data-i18n="wl.ey.urut">Peringkat</h3><div id="pr-isi"></div></aside>
      <div id="tip" class="jm-wl-tip" role="status" hidden></div>
    </div>
  </div>
</section>
<section class="jm-ex" aria-labelledby="j-urut">
  <header class="jm-ex-hd">
    <div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-tabel"/></svg><span data-i18n="wl.ey.urut">Peringkat</span></span>
      <h2 class="jm-ex-j" id="j-urut"></h2><p class="jm-ex-sub" id="sub-urut"></p></div>
    <div class="jm-ex-aksi" id="aksi-urut"><!-- aksiHtml({csv,png,pdf,bagi}) --></div>
  </header>
  <div class="jm-ex-bd" id="urutan"></div>
</section>
</div>
<div id="profil" hidden>
  <div id="profil-isi"></div>
</div>
<section class="jm-ex" aria-labelledby="h-cara">
  <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-metode"/></svg><span data-i18n="an.ey.metode">Metode</span></span>
    <h2 class="jm-ex-j" id="h-cara" data-i18n="an.cara">Cara menghitung</h2></div></header>
  <div class="jm-ex-bd jm-an-cara" id="cara"></div>
</section>
<section class="jm-ex" aria-labelledby="h-kutip" hidden data-rel="tidak">
  <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-tautan"/></svg><span data-i18n="an.ey.kutip">Kutipan</span></span>
    <h2 class="jm-ex-j" id="h-kutip" data-i18n="an.kutip">Cara mengutip</h2></div></header>
  <div class="jm-ex-bd"><p id="kutip"></p></div>
</section>
</main>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/wilayah.js"></script>
</body>
</html>
