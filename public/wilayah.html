<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="wl.title">Wilayah: potensi, realisasi, dan proyek per provinsi | Direktori METI</title>
<meta name="description" content="Peta 38 provinsi: kapasitas EBT terpasang, rasio elektrifikasi, potensi panas bumi, dan proyek terlacak, dengan sumber dan tanggal di setiap angka." data-i18n-attr="content:wl.deskripsi">
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/analisis.css">
<script src="/tema.js"></script>
</head>
<body>
<header class="top" id="kepala"></header>
<main class="jm-halaman jm-wadah jm-an">
<div id="daftar">
<section class="jm-hero" aria-labelledby="judul">
  <h1 id="judul" data-i18n="wl.judul">Wilayah: seberapa jauh realisasi dari potensi?</h1>
  <p class="jm-an-label" data-i18n="an.jawaban">Jawaban singkat</p>
  <p id="jawab"></p>
</section>
<section id="kartu" class="jm-an-kartu-baris" aria-label="Ringkasan" data-i18n-attr="aria-label:an.ringkasan"></section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-peta">
  <header class="jm-an-kepala">
    <div><h2 id="h-peta" data-i18n="wl.peta">Peta 38 provinsi</h2><p class="jm-temuan" id="temuan-peta"></p></div>
    <div class="jm-tab" role="tablist" aria-label="Metrik" data-i18n-attr="aria-label:wl.metrik">
      <button type="button" role="tab" data-m="terpasang" aria-selected="true" data-i18n="wl.m.terpasang">Kapasitas EBT terpasang</button>
      <button type="button" role="tab" data-m="rasio" aria-selected="false" data-i18n="wl.m.rasio">Rasio elektrifikasi</button>
      <button type="button" role="tab" data-m="panasbumi" aria-selected="false" data-i18n="wl.m.panasbumi">Potensi panas bumi</button>
      <button type="button" role="tab" data-m="proyek" aria-selected="false" data-i18n="wl.m.proyek">Jumlah proyek</button>
    </div>
  </header>
  <div class="jm-an-petabagian">
    <div id="peta" class="jm-an-peta" role="region" aria-label="Peta" data-i18n-attr="aria-label:wl.peta_label"></div>
    <div id="legenda" class="jm-an-legenda"></div>
  </div>
  <div id="peta-info"></div>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-urut">
  <header class="jm-an-kepala"><div><h2 id="h-urut" data-i18n="wl.urutan">Peringkat provinsi</h2><p class="jm-temuan" id="temuan-urut"></p></div></header>
  <div id="urutan"></div>
</section>
</div>
<div id="profil" hidden>
  <p><a href="/wilayah" data-i18n="wl.semua">Semua provinsi</a></p>
  <div id="profil-isi"></div>
</div>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-cara">
  <details open><summary id="h-cara" data-i18n="an.cara">Cara menghitung</summary><div class="jm-an-cara" id="cara"></div></details>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-kutip">
  <h2 id="h-kutip" data-i18n="an.kutip">Cara mengutip</h2>
  <p id="kutip"></p>
</section>
</main>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/wilayah.js"></script>
</body>
