<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="rt.title">Rantai pasok PLTS 100 GWp: kebutuhan program dan pasokan pabrikan lokal | Direktori METI</title>
<meta name="description" content="Cukupkah pasokan modul surya lokal untuk program PLTS 100 GWp? Kapasitas 40 pabrikan, ekspor, TKDN, dan lokasi pabrik, bersumber dan bertanggal." data-i18n-attr="content:rt.deskripsi">
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/analisis.css">
<script src="/tema.js"></script>
</head>
<body>
<header class="top" id="kepala"></header>
<main class="jm-halaman jm-wadah jm-an">
<section class="jm-hero" aria-labelledby="judul">
  <h1 id="judul" data-i18n="rt.judul">Rantai pasok PLTS 100 GWp: cukupkah pasokan lokal?</h1>
  <p class="jm-an-label" data-i18n="an.jawaban">Jawaban singkat</p>
  <p id="jawab"></p>
</section>
<section id="kartu" class="jm-an-kartu-baris" aria-label="Ringkasan" data-i18n-attr="aria-label:an.ringkasan"></section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-keb">
  <header class="jm-an-kepala">
    <div><h2 id="h-keb" data-i18n="rt.kebutuhan">Kebutuhan program dan kapasitas pabrikan per tahun</h2><p class="jm-temuan" id="temuan-keb"></p></div>
    <div class="jm-tab" role="tablist" aria-label="Horizon" data-i18n-attr="aria-label:rt.horizon">
      <button type="button" role="tab" data-h="5" aria-selected="false" data-i18n="rt.h5">5 tahun</button>
      <button type="button" role="tab" data-h="8" aria-selected="false" data-i18n="rt.h8">8 tahun</button>
      <button type="button" role="tab" data-h="10" aria-selected="true" data-i18n="rt.h10">10 tahun</button>
    </div>
  </header>
  <div id="grafik-keb"></div>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-tkdn">
  <header class="jm-an-kepala"><div><h2 id="h-tkdn" data-i18n="rt.tkdn">Sebaran TKDN pabrikan</h2><p class="jm-temuan" id="temuan-tkdn"></p></div></header>
  <div id="grafik-tkdn"></div>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-peta">
  <header class="jm-an-kepala">
    <div><h2 id="h-peta" data-i18n="rt.peta">Lokasi pabrik modul</h2><p class="jm-temuan" id="temuan-peta"></p></div>
    <div class="jm-an-chip">
      <div class="jm-tab" id="seg-pasar" role="tablist" aria-label="Pasar" data-i18n-attr="aria-label:rt.f_pasar">
        <button type="button" role="tab" data-p="" aria-selected="true" data-i18n="rt.semua">Semua</button>
        <button type="button" role="tab" data-p="lokal" aria-selected="false" data-i18n="rt.pasar.lokal">Lokal</button>
        <button type="button" role="tab" data-p="ekspor" aria-selected="false" data-i18n="rt.pasar.ekspor">Ekspor</button>
        <button type="button" role="tab" data-p="keduanya" aria-selected="false" data-i18n="rt.pasar.keduanya">Lokal dan ekspor</button>
      </div>
      <div class="jm-tab" id="seg-apamsi" role="tablist" aria-label="APAMSI" data-i18n-attr="aria-label:rt.f_apamsi">
        <button type="button" role="tab" data-a="" aria-selected="true" data-i18n="rt.apamsi_semua">Semua anggota</button>
        <button type="button" role="tab" data-a="ya" aria-selected="false" data-i18n="rt.apamsi_ya">Anggota APAMSI</button>
        <button type="button" role="tab" data-a="tidak" aria-selected="false" data-i18n="rt.apamsi_tidak">Bukan anggota</button>
      </div>
    </div>
  </header>
  <div class="jm-peta-grid">
    <div class="jm-peta-bingkai">
      <div id="peta-pabrik" class="jm-an-peta" role="region" aria-label="Peta" data-i18n-attr="aria-label:rt.peta_label"></div>
      <span class="jm-pil jm-an-pilpeta" data-i18n="rt.peta_pil">Titik pusat kota, perkiraan</span>
    </div>
    <aside id="kota-panel" class="jm-peta-panel" aria-live="polite"></aside>
  </div>
  <p class="jm-an-kunci" id="legenda-peta"></p>
  <div id="tabel-kota"></div>
  <div id="sumber-peta"></div>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-tabel">
  <header class="jm-an-kepala"><div><h2 id="h-tabel" data-i18n="rt.tabel">Daftar pabrikan modul surya</h2><p class="jm-temuan" id="temuan-tabel"></p></div></header>
  <div class="jm-saring" id="saring"></div>
  <div id="tabel"></div>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-cara">
  <details open><summary id="h-cara" data-i18n="an.cara">Cara menghitung</summary><div class="jm-an-cara" id="cara"></div></details>
</section>
<section class="jm-kartu jm-an-wadah" aria-labelledby="h-kutip">
  <h2 id="h-kutip" data-i18n="an.kutip">Cara mengutip</h2>
  <p id="kutip"></p>
</section>
</main>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/rantai.js"></script>
</body>
</html>
