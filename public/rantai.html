<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="rt.title">Rantai pasok PLTS 100 GWp: kebutuhan program dan pasokan pabrikan lokal | Direktori METI</title>
<meta name="description" content="Cukupkah pasokan modul surya lokal untuk program PLTS 100 GWp? Kapasitas 40 pabrikan, ekspor, TKDN, dan lokasi pabrik, bersumber dan bertanggal." data-i18n-attr="content:rt.deskripsi">
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/analisis.css">
<script src="/tema.js"></script>
</head>
<body>
<header class="top" id="kepala"></header>
<main class="jm-halaman jm-an">
<section class="jm-hero" aria-labelledby="judul">
  <h1 id="judul" data-i18n="rt.judul">Rantai pasok PLTS 100 GWp: cukupkah pasokan lokal?</h1>
  <p class="jm-an-label" data-i18n="an.jawaban">Jawaban singkat</p>
  <p id="jawab"></p>
</section>
<section id="kartu" class="jm-an-kartu-baris" aria-label="Ringkasan" data-i18n-attr="aria-label:an.ringkasan"></section>
<section class="jm-kartu" aria-labelledby="h-keb">
  <h2 id="h-keb" data-i18n="rt.kebutuhan">Kebutuhan program dan kapasitas pabrikan per tahun</h2>
  <div class="jm-an-sakelar" role="group" aria-label="Horizon" data-i18n-attr="aria-label:rt.horizon">
    <button type="button" data-h="5" aria-pressed="false" data-i18n="rt.h5">Selesai 5 tahun</button>
    <button type="button" data-h="8" aria-pressed="false" data-i18n="rt.h8">Selesai 8 tahun</button>
    <button type="button" data-h="10" aria-pressed="true" data-i18n="rt.h10">Selesai 10 tahun</button>
  </div>
  <div id="grafik-keb"></div>
</section>
<section class="jm-kartu" aria-labelledby="h-tkdn">
  <h2 id="h-tkdn" data-i18n="rt.tkdn">Sebaran TKDN pabrikan</h2>
  <div id="grafik-tkdn"></div>
</section>
<section class="jm-kartu" aria-labelledby="h-peta">
  <h2 id="h-peta" data-i18n="rt.peta">Lokasi pabrik modul</h2>
  <div id="peta-pabrik"></div>
</section>
<section class="jm-kartu" aria-labelledby="h-tabel">
  <h2 id="h-tabel" data-i18n="rt.tabel">Daftar pabrikan modul surya</h2>
  <div class="jm-an-bar">
    <div class="jm-medan"><label for="cari" data-i18n="rt.cari">Cari nama atau kota</label><input class="jm-isian" id="cari" type="search" autocomplete="off"></div>
    <div class="jm-medan"><label for="f-pasar" data-i18n="rt.f_pasar">Pasar</label>
      <select class="jm-pilih" id="f-pasar"><option value="" data-i18n="rt.semua">Semua</option><option value="lokal" data-i18n="rt.pasar.lokal">Lokal</option><option value="ekspor" data-i18n="rt.pasar.ekspor">Ekspor</option><option value="keduanya" data-i18n="rt.pasar.keduanya">Lokal dan ekspor</option></select></div>
    <div class="jm-medan"><label for="f-apamsi" data-i18n="rt.f_apamsi">Anggota APAMSI</label>
      <select class="jm-pilih" id="f-apamsi"><option value="" data-i18n="rt.semua">Semua</option><option value="ya" data-i18n="rt.ya">Ya</option><option value="tidak" data-i18n="rt.tidak">Tidak</option></select></div>
    <div class="jm-medan"><label for="urut" data-i18n="rt.urut">Urutkan</label>
      <select class="jm-pilih" id="urut"><option value="mwp" data-i18n="rt.col.mwp">Kapasitas (MWp per tahun)</option><option value="nama" data-i18n="rt.col.nama">Pabrikan</option><option value="tkdn" data-i18n="rt.col.tkdn">TKDN (%)</option></select></div>
  </div>
  <p id="tabel-info" class="jm-bantu" role="status"></p>
  <div id="tabel"></div>
</section>
<section class="jm-kartu" aria-labelledby="h-cara">
  <details open><summary id="h-cara" data-i18n="an.cara">Cara menghitung</summary><div class="jm-an-cara" id="cara"></div></details>
</section>
<section class="jm-kartu" aria-labelledby="h-kutip">
  <h2 id="h-kutip" data-i18n="an.kutip">Cara mengutip</h2>
  <p id="kutip"></p>
</section>
</main>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/rantai.js"></script>
</body>
</html>
