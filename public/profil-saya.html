<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title data-i18n="pf.title">Profil saya | Direktori METI</title>
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/inti/kh.css">
<link rel="stylesheet" href="/profil-saya.css">
<script src="/tema.js"></script>
</head>
<body class="jm-hal-pf" data-halaman="profil-saya">
<header class="top" id="kepala"></header>
<div id="pita"></div>
<div class="jm-halaman">
  <section class="jm-kh jm-kh-satu ps-kh" aria-labelledby="judul">
    <div class="ps-sampul"><img id="psSampul" alt="" width="1200" height="300" decoding="async"><button type="button" class="jm-tbl jm-tbl-kecil ps-sampul-ganti" data-aksi="ganti-sampul"><svg class="jm-ik" width="16" height="16" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-kamera"/></svg><span data-i18n="pf.sampul.ganti">Ganti sampul</span></button></div>
    <div class="ps-ident">
      <button type="button" class="pf-foto ps-foto" id="pfFotoKepala" data-aksi="ganti-foto" data-i18n-attr="aria-label:pf.foto.ganti" aria-label="Ganti foto"></button>
      <input class="sr" type="file" id="fBerkasFoto" accept="image/png,image/jpeg,image/webp" tabindex="-1" aria-hidden="true">
      <div class="ps-ident-teks">
        <p class="jm-kh-ey"><svg class="jm-ik" width="16" height="16" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-orang"/></svg><span data-i18n="pf.eyebrow">Profil saya</span></p>
        <h1 id="judul" data-i18n="pf.judul">Profil saya</h1>
        <p class="ps-headline" id="pfSub"></p>
        <p class="ps-meta" id="pfMeta"></p>
        <div class="pf-lencana" id="pfLencana"></div>
        <div class="ps-aksi" id="pfAksi"></div>
      </div>
    </div>
  </section>
  <div id="pfPesan" aria-live="polite"></div>
  <div class="ps-kolom">
    <div class="ps-utama" id="pfPanel"><div class="jm-hantu" role="status"><i></i><i></i><i></i></div></div>
    <aside class="ps-samping" id="pfSamping" data-i18n-attr="aria-label:pf.samping.label" aria-label="Ringkasan profil"></aside>
  </div>
  <dialog class="jm-dlg ps-dlg" id="psDlg" aria-labelledby="psDlgJ"></dialog>
</div>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/profil-saya.js"></script>
</body>
</html>
