<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title data-i18n="aktivasi.title">Aktivasi akun | Jaringan METI</title>
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/inti/akun.css">
<script src="/tema.js"></script>
</head>
<body class="jm-akun" data-halaman="aktivasi">
<header class="top" id="kepala"></header>
<div id="pita"></div>
<div class="jm-halaman">
  <section class="jm-kartu jm-sempit" aria-labelledby="judul">
    <div class="jm-merek-kartu">
      <img src="/img/logo-meti.svg" width="64" height="64" alt="">
      <strong data-i18n="akun.merek">Jaringan METI</strong>
      <span data-i18n="akun.merek_sub">Ekosistem energi terbarukan Indonesia</span>
    </div>
    <div id="selesai" hidden>
      <div class="jm-form-judul"><h1 id="judul-selesai" data-i18n="aktivasi.sukses">Akunmu aktif. Silakan masuk.</h1></div>
      <a class="jm-tbl jm-tbl-utama" href="/masuk" data-i18n="jm.masuk">Masuk</a>
    </div>
    <form id="form" class="jm-form" novalidate>
      <div class="jm-form-judul">
        <h1 id="judul" data-i18n="aktivasi.judul">Aktifkan akun</h1>
        <p data-i18n="aktivasi.sub">Buat sandi untuk akunmu. Tautan ini hanya berlaku sekali.</p>
      </div>
      <div id="pesan"></div>
      <input type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" hidden>
      <div class="jm-medan jm-ambang jm-sandi"><input class="jm-isian" id="baru" name="baru" type="password" autocomplete="new-password" placeholder=" " minlength="12" maxlength="128" required><label for="baru" data-i18n="sandi.baru"></label><span class="jm-bantu" data-i18n="sandi.aturan">12 sampai 128 karakter. Jangan sama dengan surelmu.</span></div>
      <div class="jm-medan jm-ambang jm-sandi"><input class="jm-isian" id="ulang" name="ulang" type="password" autocomplete="new-password" placeholder=" " required><label for="ulang" data-i18n="sandi.ulang"></label></div>
      <button type="submit" class="jm-tbl jm-tbl-utama" id="kirim" data-i18n="aktivasi.kirim">Aktifkan akun</button>
    </form>
  </section>
</div>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/masuk.js"></script>
</body>
</html>
