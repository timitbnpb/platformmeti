<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="as.title">Posisi Indonesia di ASEAN | Direktori METI</title>
<meta name="description" content="Perbandingan 10 negara ASEAN: pangsa listrik terbarukan, kapasitas terbarukan, dan akses listrik, tren 10 tahun, dengan sumber dan tanggal." data-i18n-attr="content:as.deskripsi">
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/analisis.css">
<script src="/tema.js"></script>
</head>
<body>
<header class="top" id="kepala"></header>
<main class="jm-halaman jm-wadah jm-an">
<section class="jm-kh" aria-labelledby="judul">
  <div class="jm-kh-teks">
    <h1 id="judul" data-i18n="as.judul">Indonesia di ASEAN</h1>
    <p id="jawab" class="jm-kh-lead"></p>
  </div>
  <div class="jm-kh-ubin" id="ubin" aria-live="polite"></div>
</section>
<section id="kartu" class="jm-an-kartu-baris" aria-label="Ringkasan" data-i18n-attr="aria-label:an.ringkasan"></section>
<section class="jm-ex" aria-labelledby="h-band">
  <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-asean"/></svg><span data-i18n="an.ey.band">band</span></span><h2 class="jm-ex-j" id="temuan-band"></h2><p class="jm-ex-sub" id="h-band" data-i18n="as.bandingkan">Perbandingan 10 negara</p></div><div class="jm-ex-aksi" id="aksi-band"><!-- aksiHtml({csv,png,pdf,bagi}) --></div></header>
  <div class="jm-ex-bd">
  <div class="jm-tab" role="tablist" aria-label="Metrik" data-i18n-attr="aria-label:wl.metrik">
    <button type="button" role="tab" data-m="bauran" aria-selected="true" data-i18n="as.m.bauran">Pangsa listrik terbarukan</button>
    <button type="button" role="tab" data-m="kapasitas" aria-selected="false" data-i18n="as.m.kapasitas">Kapasitas terbarukan</button>
    <button type="button" role="tab" data-m="akses" aria-selected="false" data-i18n="as.m.akses">Akses listrik</button>
  </div>

  <div id="grafik-band"></div>
  <p id="sumber-band"></p>
</div>
</section>
<section class="jm-ex" aria-labelledby="h-tren">
  <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-analisis"/></svg><span data-i18n="an.ey.tren">tren</span></span><h2 class="jm-ex-j" id="temuan-tren"></h2><p class="jm-ex-sub" id="h-tren" data-i18n="as.tren">Tren 10 tahun</p></div><div class="jm-ex-aksi" id="aksi-tren"><!-- aksiHtml({csv,png,pdf,bagi}) --></div></header>
  <div class="jm-ex-bd">

  <div id="grafik-tren"></div>
  <div id="tabel-tren"></div>
</div>
</section>
<section class="jm-ex" aria-labelledby="h-cara">
  <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-metode"/></svg><span data-i18n="an.ey.metode">Metode</span></span>
    <h2 class="jm-ex-j" id="h-cara" data-i18n="an.cara">Cara menghitung</h2></div></header>
  <div class="jm-ex-bd jm-an-cara" id="cara"></div>
</section>
<section class="jm-ex" aria-labelledby="h-kutip">
  <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-tautan"/></svg><span data-i18n="an.ey.kutip">Kutipan</span></span>
    <h2 class="jm-ex-j" id="h-kutip" data-i18n="an.kutip">Cara mengutip</h2></div></header>
  <div class="jm-ex-bd"><p id="kutip"></p></div>
</section>
</main>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/asean.js"></script>
</body>
</html>
