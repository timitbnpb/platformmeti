<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title data-i18n="mw.title">METI Wilayah | Direktori METI</title>
<meta name="description" content="Peta dan profil METI Wilayah di seluruh provinsi: status, pengurus, sekretariat, dan cara membentuknya." data-i18n-attr="content:mw.deskripsi">
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/inti/kh.css">
<link rel="stylesheet" href="/inti/akun.css">
<link rel="stylesheet" href="/meti-wilayah.css">
<script src="/tema.js"></script>
</head>
<body data-halaman="meti-wilayah">
<header class="top" id="kepala"></header>
<div id="pita"></div>
<main class="jm-halaman jm-wadah">
  <div id="daftar">
    <section class="jm-kh" aria-labelledby="judul">
      <div class="jm-kh-teks">
        <p class="jm-kh-ey"><svg class="jm-ik" width="16" height="16" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-wilayah"/></svg><span data-i18n="mw.eyebrow">Jaringan provinsi</span></p>
        <h1 id="judul" data-i18n="mw.judul">METI Wilayah</h1>
        <p class="jm-kh-lead" data-i18n="mw.lead">Perwakilan METI di tiap provinsi: mana yang sudah berdiri, mana yang segera dilantik, dan bagaimana membentuknya di provinsimu.</p>
      </div>
      <div class="jm-kh-ubin" id="ubin" aria-live="polite"></div>
    </section>
    <p class="mw-sumber" id="sumber" role="status"></p>
    <div class="mw-penuh" id="penuh">
      <div class="mw-peta" id="peta" role="region" aria-label="Peta" data-i18n-attr="aria-label:mw.peta_label"></div>
      <details class="mw-panel" id="panel" open>
        <summary data-i18n="mw.legenda">Status per provinsi</summary>
        <div class="mw-panel-isi" id="legenda"></div>
      </details>
      <div class="mw-tip" id="tip" role="status" hidden></div>
    </div>
    <section class="jm-ex mw-bagian" aria-labelledby="j-kartu">
      <header class="jm-ex-hd"><div class="jm-ex-teks"><span class="jm-ex-ey"><svg class="jm-ik" width="14" height="14" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-daftar"/></svg><span data-i18n="mw.ey.daftar">Daftar wilayah</span></span>
        <h2 class="jm-ex-j" id="j-kartu" data-i18n="mw.daftar">Semua provinsi</h2>
        <p class="jm-ex-sub" id="ringkas"></p></div></header>
      <div class="jm-ex-bd">
        <div class="mw-alat">
          <label class="jm-cari"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-cari"/></svg><input type="search" id="cari" autocomplete="off" placeholder="Cari provinsi" aria-label="Cari provinsi" data-i18n-attr="placeholder:mw.cari;aria-label:mw.cari"></label>
          <div class="mw-saring" id="saring" role="group" aria-label="Status" data-i18n-attr="aria-label:mw.filter"></div>
        </div>
        <div class="mw-kisi" id="kisi" aria-live="polite"></div>
      </div>
    </section>
  </div>
  <div id="profil" hidden></div>
</main>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/meti-wilayah.js"></script>
</body>
</html>
