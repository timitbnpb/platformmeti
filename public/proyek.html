<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title data-i18n="pj.title">Pelacak Proyek Energi Terbarukan | Direktori METI</title>
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<script src="/tema.js"></script>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/publik.css">
<link rel="stylesheet" href="/proyek.css">
</head>
<body data-halaman="proyek">
<header class="top" id="kepala"></header>
<main class="jm-wadah jm-pj-halaman" id="isi">
  <header class="jm-judul jm-pj-judul">
    <p class="jm-eyebrow"><span class="jm-kotak" aria-hidden="true"></span><span data-i18n="pj.eyebrow">Pelacak proyek EBT</span></p>
    <h1 id="judul" data-i18n="pj.judul">Pelacak proyek energi terbarukan</h1>
    <p data-i18n="pj.lead">Proyek pembangkit dan program transisi energi nasional, lengkap dengan status, target COD, lokasi, dan sumber tiap angka.</p>
  </header>
  <div class="jm-kisi" id="pjAngka"></div>
  <div id="exGb"><div class="jm-pj-isi"><div class="jm-pj-ringkas">
    <div>
      <h3 id="hStat" data-i18n="pj.stat.judul">Status proyek</h3>
      <div id="pjStatus"></div>
    </div>
    <div>
      <h3 id="hPbar" data-i18n="pj.pbar.judul">Proyek per program</h3>
      <div id="pjProgBar"></div>
    </div>
  </div></div></div>

  <div id="exPeta"><div class="jm-pj-isi">
    <div class="jm-saring" id="pjSaring" role="group" data-i18n-attr="aria-label:pj.saring">
      <label class="jm-cari"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-cari2"/></svg><span class="sr" data-i18n="pj.f.cari">Cari proyek</span><input id="fq" type="search" autocomplete="off" data-i18n-attr="placeholder:pj.f.cari"></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-jenis"/></svg><span class="sr" data-i18n="pj.f.tek">Teknologi</span><select id="ftek"></select></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-status"/></svg><span class="sr" data-i18n="pj.f.status">Status</span><select id="fst"></select></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-topik"/></svg><span class="sr" data-i18n="pj.f.program">Program</span><select id="fprog"></select></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-peta"/></svg><span class="sr" data-i18n="pj.f.provinsi">Provinsi</span><select id="fprov"></select></label>
      <button type="button" class="jm-hapus" id="freset" hidden><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-silang"/></svg><span data-i18n="jm.kosong.reset">Hapus filter</span></button>
    </div>
  </div></div>

  <section class="jm-pj-penuh" aria-label="Peta proyek" data-i18n-attr="aria-label:pj.peta.judul">
    <div id="pjPeta" class="jm-pj-kanvas" role="application" data-i18n-attr="aria-label:pj.peta.judul"></div>
    <details class="jm-pj-lapis" id="pjLapis" open><summary data-i18n="pj.lapis.judul">Lapisan peta</summary><div id="pjLegenda"></div></details>
    <span class="jm-pj-chip-hasil" id="pjHasil" role="status" aria-live="polite"></span>
    <details class="jm-pj-panel" id="pjDrawer"><summary id="pjPanelJ" data-i18n="pj.panel.judul">Proyek di peta</summary><div id="pjPanel" class="jm-pj-panel-isi"></div></details>
    <div class="jm-pj-tip" id="pjTip" role="tooltip" hidden></div>
  </section>

  <div id="exTahap"><div class="jm-pj-isi">
    <div id="pjCorong"></div>
  </div></div>

  <div id="exTelat"><div class="jm-pj-isi">
    <p class="jm-bantu" id="pjTelatKet"></p>
    <div id="pjTelat"></div>
  </div></div>

  <div id="exDaftar"><div class="jm-pj-isi">
    <div id="pjDaftar"></div>
  </div></div>

  <div id="exProg"><div class="jm-pj-isi">
    <div id="pjProg" class="jm-pj-prog"></div>
  </div></div>
</main>
<dialog class="jm-pj-sheet" id="pjProfil" aria-labelledby="pjProfilJudul"></dialog>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/proyek.js"></script>
</body>
</html>
