<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title data-i18n="pj.title">Pelacak Proyek Energi Terbarukan | Direktori METI</title>
<link rel="icon" href="/img/logo-meti-tanda.png" type="image/png">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<script src="/tema.js"></script>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<link rel="stylesheet" href="/inti/kh.css">
<link rel="stylesheet" href="/publik.css">

</head>
<body data-halaman="proyek">
<header class="top" id="kepala"></header>
<main class="jm-wadah jm-pj-halaman" id="isi">
  <section class="jm-kh jm-kh-satu" aria-labelledby="judul"><div class="jm-kh-teks">
    <p class="jm-kh-ey"><svg class="jm-ik" width="16" height="16" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-proyek"/></svg><span data-i18n="pj.eyebrow">Pelacak proyek EBT</span></p>
    <h1 id="judul" data-i18n="pj.judul">Pelacak proyek energi terbarukan</h1>
    <p class="jm-kh-lead" data-i18n="pj.lead">Proyek pembangkit dan program transisi energi nasional, lengkap dengan status, target COD, lokasi, dan sumber tiap angka.</p>
    <div class="jm-kh-aksi"><a class="jm-tbl" href="/proyek-besar.html"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-analisis"/></svg><span data-i18n="pj.ke_besar">Proyek besar</span></a><a class="jm-tbl" href="/proyek-berhenti.html"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-blokir"/></svg><span data-i18n="pj.ke_henti">Proyek berhenti</span></a></div>
  </div><div class="jm-kh-ubin" id="pjAngka" aria-live="polite"></div></section>
  <section class="jm-pj-penuh" aria-label="Peta proyek" data-i18n-attr="aria-label:pj.peta.judul">
    <div class="jm-saring jm-pj-bilah" id="pjSaring" role="group" data-i18n-attr="aria-label:pj.saring">
      <label class="jm-cari"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-cari2"/></svg><span class="sr" data-i18n="pj.f.cari">Cari proyek</span><input id="fq" type="search" autocomplete="off" data-i18n-attr="placeholder:pj.f.cari"></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-jenis"/></svg><span class="sr" data-i18n="pj.f.tek">Teknologi</span><select data-ikon="jenis" id="ftek"></select></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-status"/></svg><span class="sr" data-i18n="pj.f.status">Status</span><select data-ikon="status" id="fst"></select></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-topik"/></svg><span class="sr" data-i18n="pj.f.program">Program</span><select data-ikon="topik" id="fprog"></select></label>
      <label class="jm-pil-pilih"><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-peta"/></svg><span class="sr" data-i18n="pj.f.provinsi">Provinsi</span><select data-ikon="peta" id="fprov"></select></label>
      <button type="button" class="jm-hapus" id="freset" hidden><svg class="jm-ik" width="18" height="18" aria-hidden="true" focusable="false"><use href="/img/ikon.svg#i-silang"/></svg><span data-i18n="jm.kosong.reset">Hapus filter</span></button>
    </div>
    <div class="jm-pj-area">
      <div id="pjPeta" class="jm-pj-kanvas" role="application" data-i18n-attr="aria-label:pj.peta.judul"></div>
      <details class="jm-pj-lapis" id="pjLapis" open><summary><span data-i18n="pj.lapis.judul">Lapisan peta</span></summary><div id="pjLegenda"></div></details>
      <span class="jm-pj-chip-hasil" id="pjHasil" role="status" aria-live="polite"></span>
      <details class="jm-pj-panel" id="pjDrawer"><summary id="pjPanelJ"><span data-i18n="pj.panel.judul">Proyek di peta</span></summary><div id="pjPanel" class="jm-pj-panel-isi"></div></details>
      <div class="jm-pj-tip" id="pjTip" role="tooltip" hidden></div>
    </div>
  </section>

  <div id="exTahap"><div class="jm-pj-isi">
    <div id="pjCorong"></div>
  </div></div>

  <div id="exTelat"><div class="jm-pj-isi">
    <p class="jm-bantu" id="pjTelatKet"></p>
    <div id="pjTelat"></div>
  </div></div>

  <div id="exDaftar"><div class="jm-pj-isi">
    <div id="pjDaftar"></div>
  </div></div>

  <div id="pjKeputusan"></div>

  <div id="exProg"><div class="jm-pj-isi">
    <div id="pjProg" class="jm-pj-prog"></div>
  </div></div>
</main>
<dialog class="jm-pj-sheet" id="pjProfil" aria-labelledby="pjProfilJudul"></dialog>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/proyek.js"></script>
</body>
</html>
