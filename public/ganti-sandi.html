<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title data-i18n="ganti.title">Ganti sandi | Jaringan METI</title>
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<script src="/tema.js"></script>
</head>
<body data-halaman="ganti-sandi">
<header class="top" id="kepala"></header>
<div id="pita"></div>
<div class="jm-halaman">
  <section class="jm-kartu jm-sempit" aria-labelledby="judul">
    <div id="selesai" hidden>
      <div class="jm-form-judul"><h1 id="judul-selesai" data-i18n="ganti.sukses">Sandi sudah diganti. Perangkat lain keluar otomatis.</h1></div>
      <a class="jm-tbl jm-tbl-utama" id="lanjut" href="/" data-i18n="masuk.lanjut">Lanjutkan</a>
    </div>
    <form id="form" class="jm-form" novalidate hidden>
      <div class="jm-form-judul">
        <h1 id="judul" data-i18n="ganti.judul">Ganti sandi</h1>
        <p data-i18n="ganti.sub">Sandi baru membuat perangkat lain keluar.</p>
      </div>
      <div id="pesan"></div>
      <input type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" hidden>
      <div class="jm-medan">
        <label for="lama" data-i18n="sandi.lama">Sandi lama</label>
        <input class="jm-isian" id="lama" name="lama" type="password" autocomplete="current-password" required>
      </div>
      <div class="jm-medan">
        <label for="baru" data-i18n="sandi.baru">Sandi baru</label>
        <input class="jm-isian" id="baru" name="baru" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <span class="jm-bantu" data-i18n="sandi.aturan">12 sampai 128 karakter. Jangan sama dengan surelmu.</span>
      </div>
      <div class="jm-medan">
        <label for="ulang" data-i18n="sandi.ulang">Ulangi sandi</label>
        <input class="jm-isian" id="ulang" name="ulang" type="password" autocomplete="new-password" required>
      </div>
      <label class="jm-cek"><input type="checkbox" id="tampil"><span data-i18n="masuk.tampil">Tampilkan sandi</span></label>
      <button type="submit" class="jm-tbl jm-tbl-utama" id="kirim" data-i18n="ganti.kirim">Simpan sandi</button>
    </form>
  </section>
</div>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/masuk.js"></script>
</body>
</html>
