<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title data-i18n="masuk.title">Masuk | Jaringan METI</title>
<meta name="theme-color" content="#122B4A">
<link rel="icon" href="/img/logo-meti.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/inti/tema.css">
<link rel="stylesheet" href="/inti/kepala.css">
<link rel="stylesheet" href="/inti/gaya.css">
<link rel="stylesheet" href="/inti/jm.css">
<script src="/tema.js"></script>
</head>
<body data-halaman="masuk">
<header class="top" id="kepala"></header>
<div id="pita"></div>
<div class="jm-halaman">
  <section class="jm-kartu jm-sempit" aria-labelledby="judul">
    <div id="sudah" hidden>
      <div class="jm-form-judul"><h1 id="judul-sudah" data-i18n="masuk.sudah">Kamu sudah masuk.</h1></div>
      <a class="jm-tbl jm-tbl-utama" id="lanjut" href="/" data-i18n="masuk.lanjut">Lanjutkan</a>
    </div>
    <form id="form" class="jm-form" novalidate>
      <div class="jm-form-judul">
        <h1 id="judul" data-i18n="masuk.judul">Masuk</h1>
        <p data-i18n="masuk.sub">Gunakan akun yang dibuat Admin Jaringan METI.</p>
      </div>
      <div id="pesan"></div>
      <div class="jm-medan">
        <label for="surel" data-i18n="masuk.surel">Surel</label>
        <input class="jm-isian" id="surel" name="surel" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="jm-medan">
        <label for="sandi" data-i18n="masuk.sandi">Sandi</label>
        <input class="jm-isian" id="sandi" name="sandi" type="password" autocomplete="current-password" required>
      </div>
      <label class="jm-cek"><input type="checkbox" id="tampil"><span data-i18n="masuk.tampil">Tampilkan sandi</span></label>
      <button type="submit" class="jm-tbl jm-tbl-utama" id="kirim" data-i18n="jm.masuk">Masuk</button>
      <p class="jm-bantu" data-i18n="masuk.bantuan">Belum punya akun? Minta Admin Jaringan METI membuatkannya.</p>
    </form>
  </section>
</div>
<footer class="jm-kaki" id="kaki"></footer>
<script type="module" src="/masuk.js"></script>
</body>
</html>
